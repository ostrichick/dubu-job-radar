name: Deploy redirect to the merged site

# Dubu Job Radar moved to https://ostrichick.github.io/job-search-radar/dubu/
# (repository ostrichick/job-search-radar, collector in profiles/dubu).
# This repository no longer collects jobs; it only publishes a redirect page
# so old bookmarks keep working. The previous UI and data remain in history.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dubu-job-radar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: redirect

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
